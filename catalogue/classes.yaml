# What each API action of the box may do for an AI client. One line per action:
#   "METHOD /full/path/{param}": class # what the action does, in a few words
# Classes: read (only looks), secret (reads something private), change (alters
# the box), danger (can lose data or lock someone out), never (no client ever
# gets it). An action that is not listed here is not offered at all.
#   A read that makes the box contact another host is never "read": "change" if the caller chooses the host or the call probes on demand, "secret" if it browses a remote the owner configured.

# The module's own routes and the internal one: never reachable through the module.
"POST /v2/mcp/server": never # the module's own server
"GET /v2/mcp/status": never # the module's own status
"GET /v2/mcp/tokens": never # lists the tokens
"POST /v2/mcp/tokens": never # creates a token
"DELETE /v2/mcp/tokens/{id}": never # revokes a token
"POST /v1/users/internal/access-token": never # internal: mints an access token

# --- casaos ---
"GET /v2/casaos/file/test": never # serves a test file download
"GET /v2/casaos/file/upload": never # asks whether a chunk of a multipart upload has arrived
"POST /v2/casaos/file/upload": never # multipart upload of a file chunk
"GET /v2/casaos/health/logs": never # downloads the system logs as a zip file
"GET /v2/casaos/health/ports": read # the TCP and UDP ports in use
"GET /v2/casaos/health/services": read # the CasaOS services, running or not
"GET /v2/casaos/zt/info": secret # the remote-access ZeroTier network id, which lets anyone join it
"PUT /v2/casaos/zt/{network_id}/status": change # sets a ZeroTier network's status (does nothing for now)

# --- app_management (v2) ---
"GET /v2/app_management/apps": read # the app store catalogue
"GET /v2/app_management/apps/upgradable": read # installed apps the store has an update for
"GET /v2/app_management/apps/{id}": read # one store app's details
"GET /v2/app_management/apps/{id}/compose": read # a store app's compose template
"GET /v2/app_management/apps/{id}/stable": read # a store app's stable version tag
"GET /v2/app_management/apps/{id}/stable/{serviceName}": read # a store app service's stable version tag
"GET /v2/app_management/appstore": secret # the registered app stores and their addresses (an address can carry a credential)
"POST /v2/app_management/appstore": change # add an app store
"DELETE /v2/app_management/appstore/{id}": change # remove an app store from the list
"GET /v2/app_management/auto-update": read # the apps that update by themselves and the last nights
"PUT /v2/app_management/auto-update": change # set how long an update waits before a night applies it
"GET /v2/app_management/backup/destinations": read # the names of the backup destinations
"DELETE /v2/app_management/backup/destinations/{name}": danger # forget a backup destination
"PUT /v2/app_management/backup/destinations/{name}": danger # add or replace a backup destination and its credentials
"POST /v2/app_management/backup/destinations/{name}/check": change # ask a destination whether it is reachable and its space (it contacts the destination)
"GET /v2/app_management/backup/destinations/{name}/folders": secret # the folders under a path of a destination (the answer can quote the remote's error text)
"DELETE /v2/app_management/backup/destinations/{name}/restic": change # send a destination's next backups back to rclone
"GET /v2/app_management/backup/destinations/{name}/restic": read # whether a destination keeps its backups with restic
"PUT /v2/app_management/backup/destinations/{name}/restic": change # switch a destination to restic, answering its repository password
"POST /v2/app_management/backup/destinations/{name}/restic/check": change # start a check of a destination's restic repository
"GET /v2/app_management/backup/destinations/{name}/restic/password": secret # the password of a destination's restic repository
"GET /v2/app_management/backup/destinations/{name}/runs": secret # the backups a destination holds (the answer can quote the remote's error text)
"DELETE /v2/app_management/backup/destinations/{name}/runs/{app}/{stamp}": danger # delete one backup at a destination
"GET /v2/app_management/backup/destinations/{name}/runs/{app}/{stamp}/files": secret # list the files inside one backup (the answer can quote the remote's error text)
"GET /v2/app_management/backup/exclusions": read # the folders no backup of an app copies
"PUT /v2/app_management/backup/exclusions": change # replace the folders no backup of an app copies
"POST /v2/app_management/backup/restore": danger # put an app or the box back from a backup
"GET /v2/app_management/backup/running": read # the backups that run now
"POST /v2/app_management/backup/running/{backup_id}/stop": change # stop one backup that runs
"GET /v2/app_management/backup/runs": read # the history of backup runs
"GET /v2/app_management/backup/schedules": read # the backup schedules
"PUT /v2/app_management/backup/schedules": danger # replace the backup schedules and how many backups they keep
"POST /v2/app_management/backup/schedules/run": change # run backup schedules now
"POST /v2/app_management/backup/signin": never # start signing in to a cloud drive
"POST /v2/app_management/backup/signin/finish": never # finish signing in to a cloud drive, answering its token
"POST /v2/app_management/backup/system": change # start a backup of the box itself
"GET /v2/app_management/backup/verification-schedule": read # when backups are read back on their own
"PUT /v2/app_management/backup/verification-schedule": change # set when backups are read back on their own
"GET /v2/app_management/backup/verifications": read # the results of backup verifications
"POST /v2/app_management/backup/verifications": change # start reading a backup back to verify it
"POST /v2/app_management/backup/verifications/{verification_id}/cancel": change # cancel a running backup verification
"GET /v2/app_management/categories": read # the app store's categories
"GET /v2/app_management/cleanup": read # what a cleanup could free on the disk
"DELETE /v2/app_management/cleanup/build-cache": danger # delete the build cache
"POST /v2/app_management/cleanup/images": danger # delete leftover images
"POST /v2/app_management/cleanup/orphans": danger # move aside the folders of apps that are gone
"GET /v2/app_management/cleanup/schedule": read # the weekly cleanup and what it freed
"PUT /v2/app_management/cleanup/schedule": change # turn the weekly cleanup on or off
"POST /v2/app_management/cleanup/volumes": danger # delete leftover volumes
"GET /v2/app_management/compose": secret # installed apps with their compose files
"POST /v2/app_management/compose": change # install an app
"GET /v2/app_management/compose/updates": change # plan an update of every app, can check the registries
"POST /v2/app_management/compose/updates": change # update several apps at once
"GET /v2/app_management/compose/updates/run": read # progress of the update of every app
"DELETE /v2/app_management/compose/{id}": danger # uninstall an app
"GET /v2/app_management/compose/{id}": secret # an installed app with its compose file
"PATCH /v2/app_management/compose/{id}": change # update an app to the store's version
"PUT /v2/app_management/compose/{id}": change # apply new settings to an app
"PUT /v2/app_management/compose/{id}/auto-update": change # turn an app's nightly update on or off
"POST /v2/app_management/compose/{id}/backup": danger # back an app up, can prune its older backups
"GET /v2/app_management/compose/{id}/containers": secret # an app's containers with their labels and commands
"GET /v2/app_management/compose/{id}/containers/stats": read # CPU and memory of an app's containers
"GET /v2/app_management/compose/{id}/containers/{containerId}/health": secret # a container's health check command and output
"PUT /v2/app_management/compose/{id}/containers/{containerId}/status": change # start, stop or restart one container of an app
"GET /v2/app_management/compose/{id}/env": secret # an app's .env values
"PUT /v2/app_management/compose/{id}/env": change # replace an app's .env values
"GET /v2/app_management/compose/{id}/healthcheck": read # whether an app's web page answers
"GET /v2/app_management/compose/{id}/logs": secret # an app's recent log lines
"PUT /v2/app_management/compose/{id}/status": change # start, stop or restart an app
"DELETE /v2/app_management/container/{id}": danger # delete a container and the volumes asked for
"PATCH /v2/app_management/container/{id}": change # recreate a container, optionally with a newer image
"GET /v2/app_management/container/{id}/detail": secret # a container's details with its environment
"DELETE /v2/app_management/container/{id}/files": danger # delete a file or folder inside a container
"GET /v2/app_management/container/{id}/files": read # list a folder inside a container
"GET /v2/app_management/container/{id}/files/content": secret # read a text file inside a container
"PUT /v2/app_management/container/{id}/files/content": danger # write or overwrite a text file inside a container
"GET /v2/app_management/container/{id}/files/download": never # download a file from a container
"POST /v2/app_management/container/{id}/files/folder": change # make a folder inside a container
"POST /v2/app_management/container/{id}/files/upload": never # upload a file into a container
"GET /v2/app_management/container/{id}/healthcheck": read # whether a container is healthy
"POST /v2/app_management/convert": read # turn a legacy app description into compose YAML
"GET /v2/app_management/dashboard-hidden/{app}": read # whether an app's icon is hidden from the dashboard
"PUT /v2/app_management/dashboard-hidden/{app}": change # hide or show an app's icon on the dashboard
"POST /v2/app_management/git": change # register an app from a git repository
"DELETE /v2/app_management/git/{app}": danger # remove a git app
"GET /v2/app_management/git/{app}": secret # a git app with its webhook secret
"PUT /v2/app_management/git/{app}": change # change a git app's settings
"POST /v2/app_management/git/{app}/check": change # fetch a git app's repository for new commits
"POST /v2/app_management/git/{app}/deploy": change # deploy a git app
"GET /v2/app_management/git/{app}/tags": secret # the tags of a git app's repository (it contacts the repository)
"POST /v2/app_management/git/{app}/webhook": never # a git forge's webhook delivery
"GET /v2/app_management/global": secret # the global app variables, API keys included
"DELETE /v2/app_management/global/{key}": danger # remove a global app variable from every app
"GET /v2/app_management/global/{key}": secret # one global app variable with its value
"PUT /v2/app_management/global/{key}": change # set a global app variable for every app
"POST /v2/app_management/image": change # pull the latest images of containers
"POST /v2/app_management/image-updates": change # check every app for a newer image and record it
"DELETE /v2/app_management/images/dangling": danger # delete dangling images
"GET /v2/app_management/images/dangling": read # the disk dangling images hold
"GET /v2/app_management/info": read # the box's architecture and API features
"GET /v2/app_management/logs": secret # a page of app log lines
"GET /v2/app_management/logs/apps": read # the apps that have logs
"GET /v2/app_management/logs/events": read # app events: started, stopped, updated
"GET /v2/app_management/logs/export": never # download app logs as a file
"GET /v2/app_management/logs/settings": read # log retention, size cap and use
"PUT /v2/app_management/logs/settings": change # set log retention and size cap
"GET /v2/app_management/logs/stream": never # live app log lines over a websocket
"GET /v2/app_management/operations": read # what runs on the apps right now
"GET /v2/app_management/stats": read # containers with their latest CPU and memory
"GET /v2/app_management/stats/{id}": read # one container's CPU and memory history
"GET /v2/app_management/stats/{id}/alerts": read # one container's alert rules and firing alerts
"PUT /v2/app_management/stats/{id}/alerts": change # set one container's alert rules
"GET /v2/app_management/sync/tasks": read # the scheduled folder syncs
"PUT /v2/app_management/sync/tasks": danger # replace the scheduled folder syncs
"POST /v2/app_management/sync/tasks/{id}/confirm-deletes": danger # let a sync task delete what it held back
"POST /v2/app_management/sync/tasks/{id}/first-pass": change # run the first pass of a sync task
"POST /v2/app_management/sync/tasks/{id}/run": change # run a sync task now
"GET /v2/app_management/visibility-orphans": read # visibility entries of apps no longer installed
"DELETE /v2/app_management/visibility/accounts/{id}": never # internal: forget an account deleted by the user service
"DELETE /v2/app_management/visibility/{app}": change # show an app to every account again
"GET /v2/app_management/visibility/{app}": read # the accounts an app is hidden from
"PUT /v2/app_management/visibility/{app}": change # set the accounts an app is hidden from
"GET /v2/app_management/web/appgrid": read # the dashboard's apps
"GET /v2/app_management/web/frame-check": change # ask a URL whether it can be shown in a frame
"POST /v2/app_management/web/sync/appstore": change # add an app store and wait for it

# --- app_management v1 container ---
"GET /v1/container/archive/{id}": never # the description says GET, the service registers PUT: not callable as described
"GET /v1/container/networks": read # the Docker networks
"GET /v1/container/usage": read # CPU and memory of every container
"DELETE /v1/container/{id}": danger # uninstall a legacy container app
"GET /v1/container/{id}": secret # a legacy container's settings with its environment
"PUT /v1/container/{id}": change # recreate a legacy container with new settings
"GET /v1/container/{id}/compose": secret # a legacy container as compose YAML with its environment
"GET /v1/container/{id}/terminal": never # a shell inside a container

# --- local_storage ---
"GET /v2/local_storage/merge": read # the storage merges and their source volumes
"POST /v2/local_storage/merge": danger # creates, changes or removes a storage merge
"GET /v2/local_storage/merge/init": read # whether the /DATA merge is set up and mounted
"POST /v2/local_storage/merge/init": danger # prepares /DATA for a merge, moving its contents away
"DELETE /v2/local_storage/mount": danger # unmounts a volume
"GET /v2/local_storage/mount": read # the mounted volumes
"POST /v2/local_storage/mount": change # mounts a volume
"PUT /v2/local_storage/mount": danger # unmounts a volume and mounts it again with new settings

# --- users ---
"DELETE /v2/users/event/local_storage/{serial}": change # dismisses the storage notices of one disk
"DELETE /v2/users/event/{event_uuid}": change # dismisses one notice
"GET /v2/users/events": read # the storage notices kept for the dashboard

# --- virt_management ---
"GET /v2/virt_management/host": read # what this host can run: libvirt, CPUs, memory, network
"PUT /v2/virt_management/host/storage": change # sets the default folder for VM disks
"GET /v2/virt_management/host/usb": read # the host's USB devices and which VM has each
"GET /v2/virt_management/images": read # the installation images in the iso folder
"GET /v2/virt_management/images/downloads": secret # the image downloads, with the full URL given, credentials included
"POST /v2/virt_management/images/downloads": change # downloads an image from a URL into the iso folder
"DELETE /v2/virt_management/images/downloads/{download}": change # cancels a running download or dismisses a finished one
"PUT /v2/virt_management/images/upload": never # binary upload of an image
"GET /v2/virt_management/stats": read # the VMs and their latest resource use
"GET /v2/virt_management/stats/{id}": read # the resource history of one VM
"GET /v2/virt_management/stats/{id}/alerts": read # the alert rules of one VM and its firing alerts
"PUT /v2/virt_management/stats/{id}/alerts": change # changes the alert rules of one VM
"GET /v2/virt_management/storage": read # whether a folder can hold VM disks and its free space
"GET /v2/virt_management/vms": read # the virtual machines and their state
"POST /v2/virt_management/vms": change # creates a virtual machine and its disk
"DELETE /v2/virt_management/vms/{id}": danger # deletes a virtual machine, its disks too on request
"GET /v2/virt_management/vms/{id}": read # one virtual machine and its settings
"PATCH /v2/virt_management/vms/{id}": change # changes a VM's name, CPUs, memory, network or autostart
"PUT /v2/virt_management/vms/{id}/cdrom": change # inserts or ejects the ISO in a VM's CD-ROM drive
"GET /v2/virt_management/vms/{id}/console": never # the VM's VNC console over a websocket
"POST /v2/virt_management/vms/{id}/disks": change # adds a new empty disk to a VM
"DELETE /v2/virt_management/vms/{id}/disks/{target}": danger # takes a disk out of a VM, deleting its file on request
"PATCH /v2/virt_management/vms/{id}/disks/{target}": change # grows a VM's disk
"PUT /v2/virt_management/vms/{id}/ports": change # sets the host ports forwarded to a VM
"PUT /v2/virt_management/vms/{id}/shares": change # sets the host folders shared with a VM
"POST /v2/virt_management/vms/{id}/snapshots": change # takes a snapshot of a VM
"DELETE /v2/virt_management/vms/{id}/snapshots/{snapshot}": danger # deletes a VM snapshot
"POST /v2/virt_management/vms/{id}/snapshots/{snapshot}/revert": danger # puts a VM back to a snapshot, losing what changed since
"PUT /v2/virt_management/vms/{id}/usb": change # sets the host USB devices given to a VM
"POST /v2/virt_management/vms/{id}/{action}": danger # changes a VM's power state; force-off and reset pull the plug

# --- vuln_scan ---
"GET /v2/vuln_scan/apps": read # what the last vulnerability scan found, per app
"GET /v2/vuln_scan/apps/{app}": read # the vulnerabilities of one app, image by image
"POST /v2/vuln_scan/scan": change # starts a vulnerability scan now
"GET /v2/vuln_scan/status": read # whether a scan runs and when the last one ended

# --- system (v1) ---
"GET /v1/sys/alerts": secret # push alert channels and settings
"PUT /v1/sys/alerts": change # change alert channels, categories, disk threshold
"POST /v1/sys/alerts/test": change # send a test alert to the channels
"GET /v1/sys/autoupdate": read # nightly automatic updates, settings and state
"PUT /v1/sys/autoupdate": change # turn nightly automatic updates on or off, set their window
"GET /v1/sys/debug": secret # bug-report text about the system
"GET /v1/sys/docker/containers": read # containers a Docker update would stop
"POST /v1/sys/docker/update": danger # update the Docker engine, stops every app
"GET /v1/sys/docker/update/status": secret # progress of the Docker update, with its log
"GET /v1/sys/entry": read # the dashboard modules' entries
"GET /v1/sys/feeds": secret # footer news feeds and headlines
"PUT /v1/sys/feeds": change # set the footer news feeds
"GET /v1/sys/hardware": read # board model and architecture
"GET /v1/sys/logs": secret # the core's log file
"GET /v1/sys/modules": read # add-on modules available and installed
"POST /v1/sys/modules/{name}/install": danger # install or update an add-on module
"POST /v1/sys/modules/{name}/plan": read # check a module install without changing anything
"POST /v1/sys/modules/{name}/remove": danger # remove an add-on module
"GET /v1/sys/modules/{name}/status": secret # where a module's install or removal stands (with the end of its output)
"GET /v1/sys/os": read # operating system and its support dates
"GET /v1/sys/os/readiness": read # whether the OS could be upgraded now
"POST /v1/sys/os/upgrade/abort": danger # call off an OS upgrade before its point of no return
"POST /v1/sys/os/upgrade/ack": danger # close, drop or hand over an OS upgrade run
"POST /v1/sys/os/upgrade/beta": danger # switch the OS upgrade feature on or off
"GET /v1/sys/os/upgrade/plan": secret # the plan of the OS upgrade (it quotes the lines of the package sources)
"POST /v1/sys/os/upgrade/plan": change # start planning the OS upgrade in a sandbox
"POST /v1/sys/os/upgrade/reboot": danger # restart the machine for the OS upgrade
"POST /v1/sys/os/upgrade/refresh": danger # bring the current OS release up to date
"POST /v1/sys/os/upgrade/resume": danger # go on with a stopped OS upgrade
"GET /v1/sys/os/upgrade/runbook": secret # shell text to upgrade the OS by hand
"POST /v1/sys/os/upgrade/start": danger # start the OS upgrade or its rehearsal
"GET /v1/sys/os/upgrade/status": secret # progress of the OS upgrade, with its output
"GET /v1/sys/packages": change # check for system package updates (runs apt-get update)
"POST /v1/sys/packages/update": danger # install system package updates
"GET /v1/sys/packages/update/status": secret # progress of the package update, with its log
"GET /v1/sys/proxy": never # the box fetches an address the caller gives: not offered
"GET /v1/sys/server-info": never # no handler
"PUT /v1/sys/server-info": never # no handler
"POST /v1/sys/ssh-login": never # check an SSH password
"PUT /v1/sys/state/{state}": danger # shut down or restart the machine
"GET /v1/sys/stats": read # measured items and latest readings
"GET /v1/sys/stats/{id}": read # processor and memory history
"GET /v1/sys/stats/{id}/alerts": read # high processor and memory alert rules
"PUT /v1/sys/stats/{id}/alerts": change # change high processor and memory alert rules
"POST /v1/sys/stop": danger # restart the ReCasaOS core service
"GET /v1/sys/telemetry": read # anonymous statistics state and preview
"PUT /v1/sys/telemetry": change # turn anonymous statistics on or off
"POST /v1/sys/update": danger # update ReCasaOS to the newest version
"GET /v1/sys/update-channel": read # update channel, releases or pre-releases
"PUT /v1/sys/update-channel": change # choose releases or pre-releases for manual updates
"GET /v1/sys/utilization": read # how loaded the machine is
"GET /v1/sys/version": read # installed and newest ReCasaOS version
"GET /v1/sys/version/check": read # installed and newest ReCasaOS version
"GET /v1/sys/version/current": read # installed ReCasaOS version
"GET /v1/sys/widgets": secret # the dashboard's API widgets: the addresses the box reads and their recipes
"GET /v1/sys/widgets/{id}/card": secret # one API widget's card (the box reads the address the owner set)
"GET /v1/sys/wsssh": never # interactive SSH terminal websocket
